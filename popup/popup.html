<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../shared.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="where">
      <span id="project" class="project"></span>
      <span id="current" class="badge" hidden><span class="dot"></span><span></span></span>
    </div>
    <button id="settings" class="icon-btn" title="Settings" aria-label="Settings"></button>
  </header>

  <main id="main">
    <div id="switch" hidden>
      <div class="label">Switch to</div>
      <ul id="envs"></ul>
      <p class="hint muted">Click to open here · <kbd id="hint-mod">⌘</kbd>-click or <span class="inline-icon" id="hint-icon"></span> for a new tab</p>
    </div>

    <div id="empty" class="empty" hidden>
      <div class="empty-icon" id="empty-icon"></div>
      <div class="empty-title" id="empty-title"></div>
      <div class="empty-text muted" id="empty-text"></div>
      <button id="add-site" class="primary" hidden></button>
    </div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
